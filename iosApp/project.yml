name: iosApp
options:
  bundleIdPrefix: dev.viethung.skeleton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    Release:
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  NumberInput:
    path: ../swift-package/NumberInput

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.md"
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Skeleton
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viethung.skeleton.iosApp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - framework: ../shared-app/build/XCFrameworks/debug/SkeletonApp.xcframework
        embed: true
        codeSign: true
      - package: NumberInput

  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viethung.skeleton.iosAppTests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosApp"
    dependencies:
      - target: iosApp

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
