# Gradle performance
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 introduces built-in Kotlin which conflicts with kotlin.multiplatform plugin
# applied in androidApp. Disable so the KMP plugin owns the `kotlin` extension.
# See: https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
# AGP 9 new DSL (ApplicationExtensionImpl) is incompatible with KMP androidTarget()
# in a com.android.application module. Temporary bypass — long-term fix is to move
# androidApp under com.android.kotlin.multiplatform.library or remove kotlin.multiplatform.
# See: https://kotl.in/gradle/agp-new-kmp
android.newDsl=false

# KMP
kotlin.mpp.enableCInteropCommonization=true
